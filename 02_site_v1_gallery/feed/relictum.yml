<description><![CDATA[Тёплое море покрывало юг нынешнего Китая 235 миллионов лет назад. По его поверхности дрейфовали стволы деревьев, и к ним, как ожившие цветы на длинных стеблях, крепились колонии Traumatocrinus — триасовых морских лилий. Морская лилия только выглядит растением. Это животное, родственник морских звёзд и ежей: веер перистых рук раскрывался в толще воды и процеживал её, собирая планктон, а членистый стебель держал крону на дрейфующем плавнике. Когда дерево тонуло, колония опускалась на дно и оказывалась погребённой в тонком иле — так возникли плиты формации Гуаньлин, к которой относится и этот экземпляр. Иловое захоронение сохранило этих животных с редкой полнотой: кроны, перистые руки и стебли лежат в породе рельефом, как гербарий, собранный самой геологией. Каждая плита — это одна сцена той катастрофы и одна композиция, не повторяющаяся дважды. Морские лилии этого рода исчезли вместе со своим миром, но их изящество не устарело за четверть миллиарда лет. Плита с Traumatocrinus сохраняет колонию в прижизненном положении — так, как она дрейфовала на своём стволе.]]></description>
