<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="over.css">
</head>
<body class="over">
  <img class="bg" id="bg" alt="">
  <div class="veil"></div>
  <div class="block">
    <div class="kicker" id="kicker"></div>
    <div class="big" id="big"></div>
    <div class="sub" id="sub"></div>
  </div>
  <img class="mark" src="../../shared/brand/Relictum_comet_gold.png" alt="">
<!--CARD_DATA-->
<script>
  var d = window.CARD_DATA || {};
  document.getElementById('bg').src = d.bgUrl || '';
  document.getElementById('kicker').textContent = d.name || '';
  document.getElementById('big').textContent = d.big || '';
  // Период стоит в кикере рядом с именем предмета: на кадре отдельная строка
  // под числом уводила бы текстовый блок в светлую часть фотографии.
  if (d.period) {
    var k = document.getElementById('kicker');
    k.textContent = k.textContent ? k.textContent + ' · ' + d.period : d.period;
  }
  var sub = document.getElementById('sub');
  if (d.sub) sub.textContent = d.sub; else sub.remove();
</script>
</body>
</html>
